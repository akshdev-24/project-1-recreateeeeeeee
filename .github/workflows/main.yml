name: YouTube Shayari Automation

on:
  workflow_dispatch:
    inputs:
      shayari:
        description: "Optional manual Shayari"
        required: false
        type: string
        default: ""

  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * *"

    # 02:00 PM IST
    - cron: "30 8 * * *"

concurrency:
  group: youtube-shayari-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install FFmpeg
      # --------------------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --------------------------------------------------
      # 4. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 5. Validate project assets
      # --------------------------------------------------
      - name: Validate assets
        run: |
          test -f "assets/background.jpg"
          test -f "assets/description.txt"
          test -f "assets/tags.txt"
          test -f "assets/titles.txt"
          test -f "assets/music/bg_music.mp3"
          test -f "assets/fonts/times.ttf"

          echo "All required assets found."

      # --------------------------------------------------
      # 6. Validate titles
      # --------------------------------------------------
      - name: Validate 50 titles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/titles.txt")

          titles = [
              line.strip()
              for line in path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          print(f"Titles found: {len(titles)}")

          if len(titles) != 50:
              raise SystemExit(
                  f"ERROR: Expected exactly 50 titles, found {len(titles)}"
              )

          if len(set(titles)) != 50:
              raise SystemExit("ERROR: Duplicate titles found.")

          print("50 unique titles verified.")
          PY

      # --------------------------------------------------
      # 7. Validate Python files
      # --------------------------------------------------
      - name: Validate Python code
        run: |
          python -m py_compile main.py
          python -m py_compile src/*.py

      # --------------------------------------------------
      # 8. Restore YouTube OAuth client secret
      # --------------------------------------------------
      - name: Restore YouTube client secrets
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
        run: |
          if [ -z "$CLIENT_SECRET_B64" ]; then
            echo "CLIENT_SECRET_B64 secret is missing."
            exit 1
          fi

          echo "$CLIENT_SECRET_B64" | base64 --decode > client_secrets.json

          test -s client_secrets.json

          echo "YouTube client secrets restored."

      # --------------------------------------------------
      # 9. Restore YouTube credentials
      # --------------------------------------------------
      - name: Restore YouTube credentials
        env:
          CREDENTIALS_B64: ${{ secrets.CREDENTIALS_B64 }}
        run: |
          if [ -z "$CREDENTIALS_B64" ]; then
            echo "CREDENTIALS_B64 secret is missing."
            exit 1
          fi

          echo "$CREDENTIALS_B64" | base64 --decode > credentials.json

          test -s credentials.json

          echo "YouTube credentials restored."

      # --------------------------------------------------
      # 10. Generate video
      # --------------------------------------------------
      - name: Generate Shayari video
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SHAYARI_INPUT: ${{ inputs.shayari }}
        run: |
          python main.py

      # --------------------------------------------------
      # 11. Verify generated video
      # --------------------------------------------------
      - name: Verify generated video
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          videos = list(Path(".").glob("*.mp4"))

          if not videos:
              videos = list(Path("output").glob("*.mp4"))

          if not videos:
              raise SystemExit("ERROR: No generated MP4 found.")

          video = max(videos, key=lambda p: p.stat().st_mtime)

          print(f"Generated video: {video}")

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries",
                  "stream=width,height,r_frame_rate",
                  "-of", "default=noprint_wrappers=1",
                  str(video),
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          print(result.stdout)

          if "width=1080" not in result.stdout:
              raise SystemExit("ERROR: Video width is not 1080.")

          if "height=1920" not in result.stdout:
              raise SystemExit("ERROR: Video height is not 1920.")

          print("1080x1920 video verified.")
          PY

      # --------------------------------------------------
      # 12. Upload video artifact
      # --------------------------------------------------
      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shayari-video
          path: |
            *.mp4
            output/*.mp4
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------
      # 13. Commit rotation/history files
      # --------------------------------------------------
      - name: Save title rotation and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add title_rotation.json content_history.json

          if git diff --cached --quiet; then
            echo "No rotation/history changes to commit."
          else
            git commit -m "Update Shayari automation state"
            git push
          fi

      # --------------------------------------------------
      # 14. Remove sensitive OAuth files
      # --------------------------------------------------
      - name: Remove OAuth files
        if: always()
        run: |
          rm -f client_secrets.json
          rm -f credentials.json

          echo "Sensitive OAuth files removed."
          
