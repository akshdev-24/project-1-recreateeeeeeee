name: YouTube Shayari Automation

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    - cron: "30 3 * * *"

    # 14:00 IST = 08:30 UTC
    - cron: "30 8 * * *"

  workflow_dispatch:
    inputs:
      shayari:
        description: "Optional manual Shayari. Leave empty for automatic Gemini generation."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-shayari-automation
  cancel-in-progress: false


jobs:

  generate-and-upload:

    runs-on: ubuntu-latest

    env:
      # ======================================================
      # GEMINI
      # ======================================================

      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # Models are tried automatically in this order.
      # If one fails, the next model is used.
      GEMINI_MODELS: "gemini-3.6-flash,gemini-3.6-flash-lite,gemini-2.5-flash"

      # ======================================================
      # SHAYARI
      # ======================================================

      SHAYARI_INPUT: ${{ inputs.shayari }}
      SHAYARI_DURATION: "15"

      # ======================================================
      # YOUTUBE
      # ======================================================

      # IMPORTANT:
      # Uploads are always UNLISTED.
      YOUTUBE_UPLOAD: "true"
      YOUTUBE_CATEGORY_ID: "22"

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ======================================================
      # 4. INSTALL PYTHON DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "Checking required project files..."

          test -f main.py
          test -f requirements.txt

          test -f src/shayari_generator.py
          test -f src/shayari_video.py
          test -f src/metadata_assets.py
          test -f src/uploader.py

          test -f assets/background.jpg
          test -f assets/description.txt
          test -f assets/tags.txt
          test -f assets/titles.txt
          test -f assets/music/bg_music.mp3
          test -f assets/fonts/times.ttf

          echo "✅ Required project files found."


      # ======================================================
      # 6. VERIFY TITLES
      # ======================================================

      - name: Validate 50 titles
        shell: bash
        run: |
          set -e

          TITLE_COUNT=$(grep -cve '^[[:space:]]*$' assets/titles.txt || true)

          echo "Title count: $TITLE_COUNT"

          if [ "$TITLE_COUNT" -ne 50 ]; then
            echo "❌ Expected exactly 50 titles."
            exit 1
          fi

          echo "✅ Exactly 50 titles found."


      # ======================================================
      # 7. VERIFY TIMES NEW ROMAN FONT
      # ======================================================

      - name: Verify Times New Roman font
        shell: bash
        run: |
          set -e

          test -f assets/fonts/times.ttf

          echo "Font file:"
          ls -lh assets/fonts/times.ttf

          echo "✅ Times New Roman font file found."


      # ======================================================
      # 8. VALIDATE PYTHON
      # ======================================================

      - name: Validate Python code
        run: |
          python -m py_compile main.py
          python -m py_compile src/*.py

          echo "✅ Python syntax validation passed."


      # ======================================================
      # 9. RESTORE YOUTUBE CLIENT SECRET
      # ======================================================

      - name: Restore YouTube client secrets
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.CLIENT_SECRET_B64 }}" ]; then
            echo "❌ CLIENT_SECRET_B64 GitHub Secret is missing."
            exit 1
          fi

          echo "${{ secrets.CLIENT_SECRET_B64 }}" | base64 --decode > client_secrets.json

          test -s client_secrets.json

          echo "✅ client_secrets.json restored."


      # ======================================================
      # 10. RESTORE YOUTUBE CREDENTIALS
      # ======================================================

      - name: Restore YouTube credentials
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.CREDENTIALS_B64 }}" ]; then
            echo "❌ CREDENTIALS_B64 GitHub Secret is missing."
            exit 1
          fi

          echo "${{ secrets.CREDENTIALS_B64 }}" | base64 --decode > credentials.json

          test -s credentials.json

          echo "✅ credentials.json restored."


      # ======================================================
      # 11. CHECK GEMINI CONFIGURATION
      # ======================================================

      - name: Check Gemini configuration
        shell: bash
        run: |
          set -e

          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "❌ GOOGLE_API_KEY GitHub Secret is missing."
            exit 1
          fi

          echo "Gemini models:"
          echo "$GEMINI_MODELS"

          echo "✅ Gemini configuration detected."


      # ======================================================
      # 12. SHOW EXECUTION MODE
      # ======================================================

      - name: Determine Shayari mode
        shell: bash
        run: |
          if [ -n "$SHAYARI_INPUT" ]; then
            echo "📝 Manual Shayari mode selected."
            echo "Gemini generation will be skipped."
          else
            echo "🤖 Automatic Shayari mode selected."
            echo "Gemini will generate Shayari."
          fi


      # ======================================================
      # 13. RUN AUTOMATION
      # ======================================================

      - name: Generate video and upload to YouTube
        run: |
          python main.py


      # ======================================================
      # 14. VERIFY GENERATED VIDEO
      # ======================================================

      - name: Verify generated video
        shell: bash
        run: |
          set -e

          VIDEO_FILE=""

          if [ -f "output.mp4" ]; then
            VIDEO_FILE="output.mp4"
          elif [ -f "output/video.mp4" ]; then
            VIDEO_FILE="output/video.mp4"
          else
            VIDEO_FILE=$(find . -type f \( -name "*.mp4" -o -name "*.mov" \) \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ No generated video found."
            exit 1
          fi

          echo "Generated video:"
          echo "$VIDEO_FILE"

          echo "Checking video dimensions..."

          WIDTH=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 "$VIDEO_FILE")

          HEIGHT=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 "$VIDEO_FILE")

          echo "Resolution: ${WIDTH}x${HEIGHT}"

          if [ "$WIDTH" -ne 1080 ] || [ "$HEIGHT" -ne 1920 ]; then
            echo "❌ Video must be exactly 1080x1920."
            exit 1
          fi

          echo "✅ Video resolution verified."


      # ======================================================
      # 15. VERIFY YOUTUBE PRIVACY
      # ======================================================

      - name: Verify YouTube privacy configuration
        run: |
          echo "YouTube upload mode: UNLISTED"
          echo "✅ Videos are configured for unlisted upload."
          echo "⚠️ Workflow will never automatically publish videos."


      # ======================================================
      # 16. UPLOAD GENERATED FILES AS ARTIFACTS
      # ======================================================

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shayari-video
          path: |
            output.mp4
            output/*.mp4
            *.mp4
          if-no-files-found: warn
          retention-days: 7


      # ======================================================
      # 17. UPLOAD LOG / STATE ARTIFACTS
      # ======================================================

      - name: Upload automation state
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shayari-state
          path: |
            title_rotation.json
            content_history.json
          if-no-files-found: warn
          retention-days: 7


      # ======================================================
      # 18. COMMIT ROTATION + HISTORY
      # ======================================================

      - name: Commit title rotation and content history
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add title_rotation.json content_history.json

          if git diff --cached --quiet; then
            echo "ℹ️ No state changes to commit."
          else
            git commit -m "chore: update Shayari automation state"
            git push
            echo "✅ Rotation/history state committed."
          fi


      # ======================================================
      # 19. REMOVE OAUTH FILES
      # ======================================================

      - name: Remove OAuth secrets
        if: always()
        shell: bash
        run: |
          rm -f client_secrets.json
          rm -f client_secret.json
          rm -f credentials.json

          echo "✅ OAuth files removed from runner."


      # ======================================================
      # 20. FINAL STATUS
      # ======================================================

      - name: Final status
        if: success()
        run: |
          echo "=================================================="
          echo "✅ YOUTUBE SHAYARI AUTOMATION COMPLETED"
          echo "=================================================="
          echo ""
          echo "• Shayari generated/used"
          echo "• Video rendered at 1080x1920"
          echo "• Times New Roman Regular used"
          echo "• Universal title/description/tags preserved"
          echo "• YouTube upload configured as UNLISTED"
          echo "• Title rotation updated"
          echo "• Content history updated"
          echo "• OAuth files removed"
          echo ""
          echo "=================================================="


      # ======================================================
      # 21. FAILURE STATUS
      # ======================================================

      - name: Failure status
        if: failure()
        run: |
          echo "=================================================="
          echo "❌ YOUTUBE SHAYARI AUTOMATION FAILED"
          echo "=================================================="
          echo ""
          echo "Check the failed step above for the exact error."
          echo ""
          echo "=================================================="
